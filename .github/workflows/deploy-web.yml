name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  quality:
    name: Web — lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  deploy:
    name: Vercel
    needs: quality
    runs-on: ubuntu-latest
    env:
      # The CLI reads all three from the environment, so no --token on any
      # command line.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # These must be IDs, not the slugs from the dashboard URL. An org id looks
      # like team_xxxxxxxx and a project id like prj_xxxxxxxx; passing the slugs
      # from vercel.com/<org-slug>/<project-slug> fails with "Project not found".
      # Both are in .vercel/project.json after running `vercel link`.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # `vercel build` runs the project's install command, so pnpm has to be on
      # PATH here as well as in the quality job - otherwise it fails with
      # "spawn pnpm ENOENT". Same versions as the tests, so what ships is what
      # was tested.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Pinned: the CLI's build/deploy behaviour changes across majors.
      - name: Install Vercel CLI
        run: npm install -g vercel@59

      # Non-fatal, so one run says whether the token is bad or the ids are.
      - name: Diagnose Vercel access
        continue-on-error: true
        run: |
          echo "token length: ${#VERCEL_TOKEN} (0 means the secret is unset;"
          echo "  an unexpected length usually means a stray newline or a partial paste)"
          echo "org id starts with:     ${VERCEL_ORG_ID:0:5}... (expect 'team_')"
          echo "project id starts with: ${VERCEL_PROJECT_ID:0:4}... (expect 'prj_')"
          echo "::group::whoami"
          vercel whoami || echo ">> whoami FAILED: the token itself is not accepted"
          echo "::endgroup::"
          echo "::group::projects this token can see"
          vercel project ls || echo ">> project ls FAILED: token cannot list projects in this scope"
          echo "::endgroup::"

      # Every Vercel command runs inside web/, so the CLI never sees anything
      # else in this repository. That matters more than it looks: Vercel turns a
      # top-level `api/` directory into one Serverless Function per file, and
      # this repo's `api/` is a NestJS backend - from the repository root it
      # produces hundreds of functions and blows past the Hobby plan's limit of
      # 12. From web/ there is no api/ directory, so no function can be created.
      #
      # This requires the Vercel project's Root Directory to be EMPTY. We are
      # already in web/; setting it to `web` as well makes the build look for
      # web/web.
      #
      # `pull` is also how VITE_API_BASE_URL reaches the build - it is baked into
      # the bundle at build time, so it must be set in the Vercel project's
      # environment variables, not here.
      - name: Pull project settings
        working-directory: web
        run: vercel pull --yes --environment=production
      - name: Build
        working-directory: web
        run: vercel build --prod
      - name: Deploy
        working-directory: web
        run: vercel deploy --prebuilt --prod
