name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  quality:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e

  deploy:
    name: Railway
    needs: quality
    runs-on: ubuntu-latest
    env:
      # An ACCOUNT/workspace token goes in RAILWAY_API_TOKEN. The other variable,
      # RAILWAY_TOKEN, is only for project-scoped tokens - passing an account
      # token there fails with "Invalid RAILWAY_TOKEN".
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      # Which project, service and environment to deploy to. All three come from
      # the Railway project URL:
      #   railway.com/project/<PROJECT_ID>/service/<SERVICE_ID>?environmentId=<ENVIRONMENT_ID>
      RAILWAY_PROJECT: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to a major version: the link/up flags below are v5 flags.
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5

      # Narrow an Unauthorized to a specific layer rather than guessing:
      #   whoami fails            -> the token itself is not accepted
      #   whoami ok, list empty   -> valid token, but it cannot see this project
      #                              (usually created for the wrong workspace)
      #   both ok, link fails     -> project visible but not this service/environment
      # Non-fatal, so a single run reports everything it can.
      - name: Diagnose Railway access
        continue-on-error: true
        run: |
          echo "token length: ${#RAILWAY_API_TOKEN} (expect a non-zero, consistent length;"
          echo "  0 means the secret is unset, an odd length often means a stray newline)"
          echo "::group::whoami"
          railway whoami || echo ">> whoami FAILED: the token is not being accepted at all"
          echo "::endgroup::"
          echo "::group::projects this token can see"
          railway list || echo ">> list FAILED: authenticated, but no project is visible"
          echo "::endgroup::"

      # Both commands run in api/, and they must share a directory: `link`
      # writes the project context that `up` then reads. Running from api/ also
      # means only the API is uploaded, so Railway builds against a directory
      # that actually has a package.json - no root-directory setting needed.
      - name: Deploy
        working-directory: api
        run: |
          railway link \
            --project "$RAILWAY_PROJECT" \
            --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT"
          # No --service here: `up` deploys to whatever `link` just selected, so
          # the service is named once and cannot drift between the two.
          railway up --detach
        # If your Railway account belongs to more than one workspace, `link`
        # cannot guess which - add to the link command above:
        #   --workspace "${{ secrets.RAILWAY_WORKSPACE }}"
